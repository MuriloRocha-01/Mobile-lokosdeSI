services:
  - type: web
    name: mobile-lokosdesi-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: JWT_SECRET
        generateValue: true
      # Banco Postgres gratuito (Supabase): cole a "Session pooler connection string" no painel do Render.
      # Sem DATABASE_URL o back-end cai no SQLite, que e apagado a cada reinicio no plano free.
      - key: DATABASE_URL
        sync: false
      # Arquivos (anexos de notas, imagens de projetos) ficam em /tmp e nao sobrevivem a reinicios no plano free.
      - key: DATA_ROOT
        value: /tmp/data
