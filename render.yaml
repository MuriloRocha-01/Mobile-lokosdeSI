services:
  - type: web
    name: mobile-lokosdesi-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_ROOT
        value: /var/data
      - key: DATABASE_FILE
        value: /var/data/Dados/database.db
    # Sem disco persistente o SQLite e os arquivos somem a cada deploy.
    # Disco exige plano pago no Render; descomente para usar.
    # disk:
    #   name: dados
    #   mountPath: /var/data
    #   sizeGB: 1
