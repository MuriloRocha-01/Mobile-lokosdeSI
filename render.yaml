services:
  - type: web
    name: mobile-lokosdesi-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_ROOT
        value: /tmp/data
      - key: DATABASE_FILE
        value: /tmp/data/Dados/database.db
    # No plano free so /tmp e gravavel e ele e apagado a cada deploy/reinicio.
    # Para persistir: plano pago, descomente o disk e mude DATA_ROOT/DATABASE_FILE para /var/data.
    # disk:
    #   name: dados
    #   mountPath: /var/data
    #   sizeGB: 1
